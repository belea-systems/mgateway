services:

  mgateway:
    image: belea/mgateway:latest-snapshot
    build: .
    ports:
      - "8791:8080"
    depends_on:
      - postgres
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/alert-deduplication
      - SPRING_KAFKA_BOOTSTRAPSERVERS=kafka:9092
      - application.jwt.signature.secret-key=NTE2QmNha2paZ2hYdkFxZWtRMDE5TjJvU3ZaU25LcWR0TmVod0x4Tm1MeQ==

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=alert-deduplication
      - POSTGRES_USER=alerts
      - POSTGRES_PASSWORD=alerts

  kafka:
    image: apache/kafka:4.3.1
    ports:
       - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://localhost:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3


  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    entrypoint: >
      sh -c "
        echo 'Waiting for Kafka...';
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do
          sleep 2;
        done;
      
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts --partitions 3 --replication-factor 1;
      "